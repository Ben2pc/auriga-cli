name: Test

# Pre-merge test gate. Before this workflow existed, `npm test` ran
# exactly once — when a release tag was pushed (`release.yml`) — so a PR
# could land on `main` with a red suite and nothing caught it until the
# next release. Payload-only changes (e.g. plugin skill edits) are exempt
# from a CLI version bump and never trigger a release tag, so their
# breakage could sit in `main` indefinitely. This workflow runs the unit
# suite + git-guard smoke tests on every PR and on every push to `main`.
#
# `npm run test:e2e` is deliberately left to `release.yml` only — it is
# slow (~90-120s) and network-bound, not suited to a per-PR gate.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Match release.yml's Node line so the gate validates against
          # the same runtime the release pipeline uses.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        # `pretest: npm run build` hook (see package.json) rebuilds
        # dist/ before tests run, so no separate Build step is needed.
        run: npm test

      - name: Git-guard hooks smoke tests
        # Plain Node smoke tests for plugins/auriga-workflow/scripts/*.mjs,
        # not part of `npm test` (hand-rolled assertion loops, not
        # node:test). Mirrors release.yml's dedicated step.
        run: npm run test:git-guards
