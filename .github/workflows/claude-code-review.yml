name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip Draft PRs and fork PRs (which can't access secrets).
    # `secrets` context is not available in job-level `if:` — use the fork flag instead.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure deep-review skill is available
        id: deep-review-contract
        # Self-review must use the contract from the checked-out branch so a
        # PR that changes deep-review is reviewed against that exact change.
        # Downstream repos without the plugin source keep the marketplace
        # installation fallback.
        run: |
          LOCAL_SKILL=plugins/auriga-workflow/skills/deep-review/SKILL.md
          INSTALLED_SKILL=.claude/skills/deep-review/SKILL.md

          if [ -f "$LOCAL_SKILL" ] && grep -q '^name: deep-review$' "$LOCAL_SKILL"; then
            SKILL=$LOCAL_SKILL
            echo "using checked-out deep-review contract"
          elif [ -f "$INSTALLED_SKILL" ] && grep -q '^name: deep-review$' "$INSTALLED_SKILL"; then
            SKILL=$INSTALLED_SKILL
            echo "using installed deep-review contract"
          else
            echo "deep-review skill missing or malformed — installing from Ben2pc/g-claude-code-plugins"
            npx -y skills add Ben2pc/g-claude-code-plugins \
              --skill deep-review \
              --agent claude-code \
              --yes
            SKILL=$INSTALLED_SKILL
          fi

          # Fail loud on partial installs or stale truncations rather than
          # improvising a review without the authoritative contract.
          if ! grep -q '^name: deep-review$' "$SKILL"; then
            echo "ERROR: no well-formed deep-review contract at $SKILL"
            exit 1
          fi
          echo "path=$SKILL" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Opus for deeper reasoning. The default (sonnet-4-6) produces
          # shallow reviews on non-trivial PRs — an earlier run on PR #31
          # surfaced 1 finding versus 11 from a locally-driven codex
          # deep-review over the same diff.
          claude_args: >-
            --model claude-opus-4-7
            --allowed-tools
            "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(rg:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(ls:*),Read,Grep,Glob"

          # Expose the SDK tool-use stream in the Action log. Without
          # this, permission denials / tool call detail are hidden and
          # you can't tell why a review went shallow.
          show_full_output: 'true'

          # Review taxonomy (dimensions, severity rules, output format) lives
          # in the deep-review SKILL.md — the single source of truth. The
          # bootstrap step above selects either the checked-out plugin source
          # or a marketplace-installed fallback and exposes its exact path.
          # This prompt defers to the skill and only encodes CI-specific
          # adaptations: serial (not parallel-dispatch) execution, and
          # two-channel posting into GitHub's review threads vs. top-level
          # comments.
          #
          # Two-channel posting: the repo has "Require conversation
          # resolution before merging" enabled, which gates on review
          # threads (inline file:line comments) — NOT on top-level issue
          # comments. Blocking findings go to inline threads (must be
          # resolved to merge); non-blocking goes to one top-level
          # comment (doesn't block, stays visible for triage).
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} on ${{ github.repository }}.

            ## Step 1 — gather context

            Run `gh pr view ${{ github.event.pull_request.number }}` and `gh pr diff ${{ github.event.pull_request.number }}` for full context. Read related source files as needed.

            ## Step 2 — load the review contract

            The dimension taxonomy, reviewer packet format, classification rules, and final synthesis format come from the `deep-review` skill — it is the authoritative contract. Read this file in full, then read each applicable reviewer file relative to its directory:

            `${{ steps.deep-review-contract.outputs.path }}`

            Apply the skill's dispatch matrix against this PR's diff.

            **Bootstrap fail-safe**: if the `Read` of the skill file fails or returns empty/truncated content, STOP. Post a single top-level comment via `gh pr comment ${{ github.event.pull_request.number }} --body "bootstrap-failed: deep-review skill unavailable at ${{ steps.deep-review-contract.outputs.path }}"` and exit without producing a review. Do NOT improvise a review without the skill contract — the review's value depends on the skill being authoritative.

            **CI-specific adaptations** (unavoidable deviations from the skill's defaults because you run serially inside GitHub Actions, not as parallel subagents):

            - Do NOT dispatch subagents. You are a single Agent — walk the skill's matrix serially, applying the Reviewer Must-Not Preamble and Reviewer Output Contract independently to each applicable dimension.
            - After all dimension packets are complete, synthesize them exactly as required by `## 6. 综合`. Recheck every finding, merge duplicate root causes, classify it, and make the main-agent repair decision before posting.
            - Do not replace the skill's final synthesis with per-dimension sections, free-form bullets, or a second summary format.

            ## Step 3 — post findings via two-channel posting (critical — do not deviate)

            **Channel A — inline review threads for BLOCKING findings** (gated by "Require conversation resolution"; author must resolve each before merge).

            Create ONE review with all blocking findings as inline comments:
            ```
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
              --method POST \
              -f event=COMMENT \
              -f body="Deep review — N blocking findings. Each inline comment below must be resolved before merge. Non-blocking findings are in a separate top-level comment." \
              -F 'comments[][path]=<file>' -F 'comments[][line]=<line>' -F 'comments[][body]=<finding description>' \
              -F 'comments[][path]=<file>' -F 'comments[][line]=<line>' -F 'comments[][body]=<finding description>' \
              ...
            ```
            If zero blocking findings, SKIP this call entirely (do not post an empty review).

            **Channel B — top-level final synthesis for ALL findings** (not gated; visible for triage).

            Always post via `gh pr comment ${{ github.event.pull_request.number }} --body-file <path>`. The file must contain the single final report beginning with `## Deep Review:` and follow the table template under the skill's `## 6. 综合` exactly:
            - Keep every classification section in the prescribed order, including sections with no entries; use the skill's empty-section marker instead of an empty table.
            - Preserve the exact columns, source grouping, final numbering, and main-agent repair decision rules defined by the skill.
            - Do not include the intermediate reviewer packets or an additional dimension-by-dimension summary.

            Format rules:
            - Do NOT restate the diff
            - Do NOT include code excerpts longer than 5 lines
            - Keep the top-level comment self-contained (so the reader doesn't need to click into inline threads for context)

            Complete both posts in a single turn. Do not explore and stop — decide severities, write both payloads, then post.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
